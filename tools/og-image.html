<!doctype html>
<!-- Izvor za public/og-image.png (1200x630). Regenerisanje: vidi CLAUDE.md -> "Link preview image". -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #040D14; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #040D14; color: #fff; font-family: 'Bricolage Grotesque', sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 40% 50%, #000 20%, transparent 100%);
  }
  .glow {
    position: absolute; right: 70px; top: 120px; width: 460px; height: 460px;
    background: rgba(0,229,204,0.16); border-radius: 50%; filter: blur(110px);
  }
  .photo {
    position: absolute; right: 70px; bottom: -40px; height: 610px;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
  }
  .fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 140px;
    background: linear-gradient(to top, #040D14 15%, transparent);
  }
  .content { position: absolute; left: 80px; top: 70px; bottom: 64px; width: 660px; display: flex; flex-direction: column; }
  .logo { font-weight: 800; font-size: 34px; letter-spacing: -0.04em; }
  .logo span, .accent { color: #00E5CC; }
  .badge {
    margin-top: 56px; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid rgba(0,229,204,0.25); background: #08131D; border-radius: 999px;
    padding: 10px 20px; font-family: 'JetBrains Mono', monospace; font-size: 15px;
    text-transform: uppercase; letter-spacing: 0.22em; color: #00E5CC;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: #00E5CC; box-shadow: 0 0 12px #00E5CC; }
  h1 { margin-top: 26px; font-size: 92px; line-height: 0.98; font-weight: 800; letter-spacing: -0.045em; }
  .role { margin-top: 22px; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 42px; line-height: 1.1; color: #00E5CC; }
  .tags { margin-top: auto; display: flex; gap: 12px; }
  .tag {
    border: 1px solid rgba(148,163,184,0.35); background: rgba(255,255,255,0.05); border-radius: 999px;
    padding: 8px 16px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.14em; color: #cbd5e1; font-weight: 600;
  }
  .url {
    position: absolute; right: 80px; bottom: 40px; z-index: 5;
    font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.12em; color: #9ca3af;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="glow"></div>
    <img class="photo" src="../src/images/bg.png" alt="">
    <div class="fade"></div>
    <div class="content">
      <div class="logo">STEFAN<span>.</span></div>
      <div class="badge"><i></i>Engineer &amp; Architect</div>
      <h1>Stefan<br>Stankovic</h1>
      <div class="role">Dynamics 365 F&amp;O · Power Platform · Web</div>
      <div class="tags">
        <span class="tag">X++</span><span class="tag">Power Apps</span><span class="tag">Astro</span><span class="tag">Tailwind</span>
      </div>
    </div>
    <div class="url">stefanstankovic.me</div>
  </div>
</body>
</html>
